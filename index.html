<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilas pues, Samaca</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #050505;
            color: #00ff00; /* Verde matrix/terminal */
            font-family: 'Space Mono', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Pantalla de inicio cruda */
        #loader {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 5px solid #00ff00;
        }

        #loader h1 { font-size: 3rem; margin-bottom: 20px; text-align: center; }

        .btn-random {
            padding: 20px 40px;
            background: #00ff00;
            color: #000;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-family: 'Archivo Black', sans-serif;
            text-transform: uppercase;
        }

        /* Layout Principal */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 95vw;
            height: 90vh;
            gap: 10px;
            padding: 10px;
        }

        /* Sección Izquierda: El "Regaño" */
        .text-box {
            border: 2px solid #333;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #111;
            position: relative;
        }

        .text-box h1 {
            font-family: 'Archivo Black', sans-serif;
            font-size: clamp(3rem, 8vw, 5rem);
            color: #fff;
            line-height: 0.9;
            margin-bottom: 1rem;
        }

        .text-box p { color: #888; font-size: 1.2rem; margin-bottom: 2rem; }

        /* Slider */
        .slider-box {
            position: relative;
            background: #000;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: scale(0.5) rotate(10deg);
        }

        .slide.active {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .slide img, .slide video {
            max-width: 90%;
            max-height: 80%;
            object-fit: contain;
            border: 5px solid white;
        }

        .caption {
            position: absolute;
            top: 10px;
            background: #ff0055;
            color: white;
            padding: 5px 15px;
            font-family: 'Archivo Black';
            transform: rotate(-2deg);
            z-index: 10;
        }

        /* Flechas - Ahora no estorban */
        .controls {
            position: absolute;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            z-index: 100;
        }

        .arrow {
            background: #fff;
            border: none;
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
        }

        /* Botón que escapa */
        #btn-no {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: transparent;
            color: #444;
            border: 1px solid #444;
            padding: 5px 10px;
            cursor: pointer;
        }

        @media (max-width: 800px) {
            .main-grid { grid-template-columns: 1fr; }
            .text-box { padding: 1rem; }
            .text-box h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div id="loader">
        <h1>OIGA,<br>SAMACA</h1>
        <button class="btn-start btn-random" onclick="start()">ABRIR ESTA VAINA</button>
    </div>

    <div class="main-grid">
        <div class="text-box">
            <h1>LA <br>CAGUÉ.</h1>
            <p>// Error 404: Dignidad no encontrada</p>
            <p>Ya, mucha pendejada. Perdón por la falla de la otra vez, socio. Usted sabe que soy un animal, pero se le aprecia.</p>
            
            <div style="margin-top: 2rem;">
                <button class="btn-random" onclick="alert('Así se habla, socio. ¡Ya cuadramos!')">TODO BIEN, PERDONADO</button>
                <button id="btn-no">No te perdono</button>
            </div>
        </div>

        <div class="slider-box">
            <div class="controls">
                <button class="arrow" onclick="move(-1)">←</button>
                <button class="arrow" onclick="move(1)">→</button>
            </div>

            <div class="slide active">
                <div class="caption">MI CARA CUANDO LA CAGUÉ</div>
                <img src="media/image.png" alt="1">
            </div>

            <div class="slide">
                <div class="caption">NIVELES DE ARREPENTIMIENTO: 100%</div>
                <video id="vid" loop muted playsinline>
                    <source src="media/video1.MOV" type="video/quicktime">
                </video>
            </div>

            <div class="slide">
                <div class="caption">¿YA SOMOS SOCIOS O QUÉ?</div>
                <img src="media/image1.png" alt="2">
            </div>

            <div class="slide">
                <div class="caption">ESTA FOTO ES RANDOM</div>
                <img src="media/image2.png" alt="3">
            </div>

            <div class="slide">
                <div class="caption">VALE POR UNA POLA</div>
                <img src="media/image3.png" alt="4">
            </div>
        </div>
    </div>

    <audio id="musica" loop>
        <source src="media/musica.mp3" type="audio/mpeg">
    </audio>

    <script>
        let index = 0;
        const slides = document.querySelectorAll('.slide');
        const video = document.getElementById('vid');
        const btnNo = document.getElementById('btn-no');

        function start() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('musica').play();
            setInterval(() => move(1), 5000);
        }

        function move(step) {
            slides[index].classList.remove('active');
            video.pause();
            index = (index + step + slides.length) % slides.length;
            slides[index].classList.add('active');
            if (slides[index].contains(video)) video.play();
        }

        // El botón que escapa (Solo para molestar)
        btnNo.addEventListener('mouseover', () => {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            btnNo.style.position = 'fixed';
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';
        });
    </script>
</body>
</html>
