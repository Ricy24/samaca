<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Te Pido Perdón</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
        }

        /* Fondo de video */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.6;
        }

        /* Overlay oscuro para mejor legibilidad */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            z-index: 1;
        }

        /* Contenedor principal */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding: 40px;
            color: white;
            text-align: center;
        }

        /* Texto principal */
        .message {
            animation: fadeInUp 1s ease-out;
        }

        .message h1 {
            font-size: 3.5em;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .name {
            font-size: 2.5em;
            font-weight: 800;
            color: #ff6b9d;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.9);
            letter-spacing: 3px;
            margin: 20px 0;
        }

        .message p {
            font-size: 1.3em;
            line-height: 1.8;
            max-width: 600px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            opacity: 0.95;
            font-weight: 300;
        }

        /* Galería/Slider de fotos */
        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 500px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            animation: slideIn 1s ease-out 0.3s both;
        }

        .carousel {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .carousel-slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .carousel-slide.active {
            opacity: 1;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: rgba(0, 0, 0, 0.3);
        }

        /* Controles del carousel */
        .carousel-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        .dot.active {
            background: #ff6b9d;
            transform: scale(1.3);
            border-color: #ff6b9d;
        }

        /* Botones de navegación */
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 107, 157, 0.7);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-btn:hover {
            background: rgba(255, 107, 157, 1);
            transform: translateY(-50%) scale(1.1);
        }

        .prev {
            left: -70px;
        }

        .next {
            right: -70px;
        }

        /* Animaciones */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                gap: 30px;
                padding: 20px;
            }

            .message h1 {
                font-size: 2.5em;
            }

            .name {
                font-size: 1.8em;
            }

            .message p {
                font-size: 1.1em;
            }

            .carousel-container {
                max-width: 90%;
                height: auto;
                aspect-ratio: 1;
            }

            .prev, .next {
                left: auto;
                right: auto;
            }

            .prev {
                left: 10px;
            }

            .next {
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Fondo de video -->
    <video class="video-background" autoplay muted loop>
        <source src="media/video1.MOV" type="video/quicktime">
        Tu navegador no soporta el tag de video.
    </video>

    <!-- Música de fondo -->
    <audio autoplay loop class="fondo-musica">
        <source src="media/musica.mp3" type="audio/mpeg">
    </audio>

    <!-- Overlay -->
    <div class="overlay"></div>

    <!-- Contenido principal -->
    <div class="container">
        <div class="message">
            <h1>TE PIDO</h1>
            <h1>PERDÓN</h1>
            <div class="name">SAMACA</div>
            <p>Siento cada momento en el que no estuve como debería. <br>
               Lamento las decisiones que te hicieron sentir mal. <br>
               Tu valor es infinito y mereces lo mejor. <br>
               <strong>Espero puedas perdonarme.</strong>
            </p>
        </div>

        <!-- Galería/Slider de fotos -->
        <div class="carousel-container">
            <div class="carousel">
                <div class="carousel-slide active">
                    <img src="media/image.png" alt="Foto 1">
                </div>
                <div class="carousel-slide">
                    <img src="media/image1.png" alt="Foto 2">
                </div>
                <div class="carousel-slide">
                    <img src="media/image2.png" alt="Foto 3">
                </div>
                <div class="carousel-slide">
                    <img src="media/image3.png" alt="Foto 4">
                </div>
            </div>

            <!-- Controles -->
            <button class="carousel-btn prev" onclick="changeSlide(-1)">❮</button>
            <button class="carousel-btn next" onclick="changeSlide(1)">❯</button>

            <div class="carousel-controls">
                <span class="dot active" onclick="currentSlide(0)"></span>
                <span class="dot" onclick="currentSlide(1)"></span>
                <span class="dot" onclick="currentSlide(2)"></span>
                <span class="dot" onclick="currentSlide(3)"></span>
            </div>
        </div>
    </div>

    <script>
        let currentIndex = 0;
        const slides = document.querySelectorAll('.carousel-slide');
        const dots = document.querySelectorAll('.dot');
        const audio = document.querySelector('.fondo-musica');

        // Reproducir música apenas cargue la página
        window.addEventListener('load', () => {
            if (audio) {
                audio.play().catch(() => {
                    console.log('Autoplay bloqueado, esperando interacción del usuario');
                });
            }
        });

        // Permitir reproducción con primer click si autoplay fue bloqueado
        document.addEventListener('click', () => {
            if (audio && audio.paused) {
                audio.play();
            }
        }, { once: true });

        // Cambiar slide automáticamente cada 5 segundos
        setInterval(() => {
            changeSlide(1);
        }, 5000);

        function changeSlide(n) {
            currentIndex += n;
            if (currentIndex >= slides.length) {
                currentIndex = 0;
            } else if (currentIndex < 0) {
                currentIndex = slides.length - 1;
            }
            updateCarousel();
        }

        function currentSlide(n) {
            currentIndex = n;
            updateCarousel();
        }

        function updateCarousel() {
            slides.forEach((slide, index) => {
                slide.classList.remove('active');
            });
            dots.forEach((dot, index) => {
                dot.classList.remove('active');
            });

            slides[currentIndex].classList.add('active');
            dots[currentIndex].classList.add('active');
        }

        // Permitir navegación con teclas
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changeSlide(-1);
            if (e.key === 'ArrowRight') changeSlide(1);
        });
    </script>
</body>
</html>
